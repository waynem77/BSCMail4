plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'io.github.waynem77'
version = '4.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Database drivers
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Annotation processors
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    compileOnly("org.projectlombok:lombok:1.18.42")

    // Testing
    testAnnotationProcessor("org.projectlombok:lombok:1.18.42")
    testCompileOnly("org.projectlombok:lombok:1.18.42")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Configure the main class for the Spring Boot JAR and bootRun
tasks.named('bootJar') {
    mainClass.set('io.github.waynem77.bscmail4.Launcher')
}

tasks.named('bootRun') {
    mainClass.set('io.github.waynem77.bscmail4.Launcher')
}

// Disable the regular jar task (we only want the bootJar)
tasks.named('jar') {
    enabled = false
}

// Task to generate DDL schema file
tasks.register('generateDdlSchema', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Generates schema.ddl file from JPA entities using the ddlschema profile'
    mainClass.set('io.github.waynem77.bscmail4.server.ServerApplication')
    classpath = sourceSets.main.runtimeClasspath
    args = []
    systemProperty('spring.profiles.active', 'ddlschema')
    // Set the absolute path for schema generation
    def schemaFile = project.file('src/main/resources/schema.ddl')
    // Convert Windows path to file:// URL format
    def schemaFileUrl = schemaFile.toURI().toString()
    systemProperty('spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target', schemaFileUrl)
    
    // Delete existing file to ensure overwrite (Hibernate appends by default)
    doFirst {
        if (schemaFile.exists()) {
            schemaFile.delete()
            logger.info("Deleted existing schema.ddl file to ensure overwrite")
        }
    }
}

