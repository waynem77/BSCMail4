# DDL Schema Generation Profile
# This profile generates a schema.dll file from JPA entities

spring.application.name=bscmail4-ddl-generator

# Disable web server (we only need JPA for schema generation)
spring.main.web-application-type=none

# Database Configuration (using H2 file-based for schema generation)
spring.datasource.url=jdbc:h2:file:./target/schema-gen-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

# JPA Schema Generation Configuration
# Generate DDL script from entity metadata
# Note: create-target is set via system property in Gradle task to ensure absolute path
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-source=metadata

# Disable Thymeleaf
spring.thymeleaf.enabled=false

# Minimal logging
logging.level.root=WARN
logging.level.org.springframework.boot=INFO

