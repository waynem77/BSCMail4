# Server Service Configuration
spring.application.name=bscmail4-service
server.port=8080

# Disable Thymeleaf for server (REST API only)
spring.thymeleaf.enabled=false

# Component scan - only server packages
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.thymeleaf.ThymeleafAutoConfiguration

# Database Configuration
# For development/testing, uses H2 in-memory database
# For production, configure a production database (PostgreSQL, MySQL, etc.)
spring.datasource.url=jdbc:h2:mem:bscmail4
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Logging
logging.level.io.github.waynem77.bscmail4.server=DEBUG

