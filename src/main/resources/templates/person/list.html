<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-people"></i> Persons</h1>
            <a th:href="@{/person/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> New Person
            </a>
        </div>

        <!-- Search and Filter Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/person}" method="get" class="row g-3">
                    <input type="hidden" th:name="page" th:value="0"/>
                    <input type="hidden" th:name="size" th:value="${currentSize}"/>
                    <input type="hidden" th:name="sortBy" th:value="${currentSortBy}"/>
                    <input type="hidden" th:name="direction" th:value="${currentDirection}"/>

                    <div class="col-md-4">
                        <label for="search" class="form-label">Search</label>
                        <input type="text" class="form-control" id="search" name="search"
                               th:value="${currentSearch}" placeholder="Name or email...">
                    </div>
                    <div class="col-md-3">
                        <label for="isActive" class="form-label">Status</label>
                        <select class="form-select" id="isActive" name="isActive">
                            <option value="">All</option>
                            <option th:value="true" th:selected="${currentIsActive == true}">Active</option>
                            <option th:value="false" th:selected="${currentIsActive == false}">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="size" class="form-label">Page Size</label>
                        <select class="form-select" id="size" name="size">
                            <option th:value="10" th:selected="${currentSize == 10}">10</option>
                            <option th:value="20" th:selected="${currentSize == 20}">20</option>
                            <option th:value="50" th:selected="${currentSize == 50}">50</option>
                            <option th:value="100" th:selected="${currentSize == 100}">100</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Results Table -->
        <div class="card">
            <div class="card-body">
                <div th:if="${container.elements == null || container.elements.isEmpty()}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 3rem; color: #ccc;"></i>
                    <p class="text-muted mt-3">No persons found.</p>
                </div>

                <div th:if="${container.elements != null && !container.elements.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>
                                        <a th:href="@{/person(page=${currentPage}, size=${currentSize}, sortBy='name', direction=${currentSortBy == 'name' && currentDirection == 'asc' ? 'desc' : 'asc'}, isActive=${currentIsActive}, search=${currentSearch})}"
                                           class="text-decoration-none">
                                            Name
                                            <i th:if="${currentSortBy == 'name' && currentDirection == 'asc'}" class="bi bi-arrow-up"></i>
                                            <i th:if="${currentSortBy == 'name' && currentDirection == 'desc'}" class="bi bi-arrow-down"></i>
                                        </a>
                                    </th>
                                    <th>
                                        <a th:href="@{/person(page=${currentPage}, size=${currentSize}, sortBy='emailAddress', direction=${currentSortBy == 'emailAddress' && currentDirection == 'asc' ? 'desc' : 'asc'}, isActive=${currentIsActive}, search=${currentSearch})}"
                                           class="text-decoration-none">
                                            Email
                                            <i th:if="${currentSortBy == 'emailAddress' && currentDirection == 'asc'}" class="bi bi-arrow-up"></i>
                                            <i th:if="${currentSortBy == 'emailAddress' && currentDirection == 'desc'}" class="bi bi-arrow-down"></i>
                                        </a>
                                    </th>
                                    <th>Phone</th>
                                    <th>
                                        <a th:href="@{/person(page=${currentPage}, size=${currentSize}, sortBy='createdAt', direction=${currentSortBy == 'createdAt' && currentDirection == 'asc' ? 'desc' : 'asc'}, isActive=${currentIsActive}, search=${currentSearch})}"
                                           class="text-decoration-none">
                                            Created At
                                            <i th:if="${currentSortBy == 'createdAt' && currentDirection == 'asc'}" class="bi bi-arrow-up"></i>
                                            <i th:if="${currentSortBy == 'createdAt' && currentDirection == 'desc'}" class="bi bi-arrow-down"></i>
                                        </a>
                                    </th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="person : ${container.elements}">
                                    <td th:text="${person.name}"></td>
                                    <td th:text="${person.emailAddress}"></td>
                                    <td th:text="${person.phone != null ? person.phone : '-'}"></td>
                                    <td th:text="${person.createdAt != null ? #temporals.format(person.createdAt, 'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
                                    <td>
                                        <form th:action="@{/person/{id}/toggle-status(id=${person.id})}" method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-link p-0 border-0 text-decoration-none"
                                                    style="cursor: pointer;"
                                                    title="Click to toggle status">
                                                <span th:if="${person.isActive}" class="badge bg-success">Active</span>
                                                <span th:unless="${person.isActive}" class="badge bg-secondary">Inactive</span>
                                            </button>
                                        </form>
                                    </td>
                                    <td>
                                        <a th:href="@{/person/{id}/edit(id=${person.id})}" class="btn btn-sm btn-outline-primary me-1">
                                            <i class="bi bi-pencil"></i> Edit
                                        </a>
                                        <a th:href="@{/person/{id}(id=${person.id})}" class="btn btn-sm btn-outline-secondary">
                                            <i class="bi bi-eye"></i> View
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${container.totalPages > 1}">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${container.isFirst} ? 'disabled'">
                                <a class="page-link" th:href="@{/person(page=${currentPage - 1}, size=${currentSize}, sortBy=${currentSortBy}, direction=${currentDirection}, isActive=${currentIsActive}, search=${currentSearch})}">
                                    <i class="bi bi-chevron-left"></i> Previous
                                </a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, container.totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/person(page=${i}, size=${currentSize}, sortBy=${currentSortBy}, direction=${currentDirection}, isActive=${currentIsActive}, search=${currentSearch})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${container.isLast} ? 'disabled'">
                                <a class="page-link" th:href="@{/person(page=${currentPage + 1}, size=${currentSize}, sortBy=${currentSortBy}, direction=${currentDirection}, isActive=${currentIsActive}, search=${currentSearch})}">
                                    Next <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <!-- Results Summary -->
                    <div class="text-muted text-center mt-3">
                        Showing <span th:text="${container.numberOfElements}"></span> of
                        <span th:text="${container.totalElements}"></span> persons
                        (Page <span th:text="${container.pageNumber + 1}"></span> of
                        <span th:text="${container.totalPages}"></span>)
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{layout :: scripts}"></script>
</body>
</html>
