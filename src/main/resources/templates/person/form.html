<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}">
</head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <div th:replace="~{layout :: alerts}"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>
                        <i class="bi bi-person-plus" th:if="${!isEdit}"></i>
                        <i class="bi bi-person-check" th:if="${isEdit}"></i>
                        <span th:text="${isEdit ? 'Edit Person' : 'Create Person'}">Create Person</span>
                    </h1>
                    <a th:href="@{/person}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to List
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form th:if="${!isEdit}" th:action="@{/person}" th:object="${person}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Name <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="name" th:field="*{name}"
                                       placeholder="Enter full name" required>
                                <div class="form-text">The person's full name</div>
                            </div>

                            <div class="mb-3">
                                <label for="emailAddress" class="form-label">
                                    Email Address <span class="text-danger">*</span>
                                </label>
                                <input type="email" class="form-control" id="emailAddress" th:field="*{emailAddress}"
                                       placeholder="Enter email address" required>
                                <div class="form-text">The person's email address</div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                       placeholder="Enter phone number">
                                <div class="form-text">The person's phone number (optional)</div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/person}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Create Person
                                </button>
                            </div>
                        </form>
                        <form th:if="${isEdit}" th:action="@{/person/{id}(id=${personId})}" th:object="${person}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Name <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control" id="name" th:field="*{name}"
                                       placeholder="Enter full name" required>
                                <div class="form-text">The person's full name</div>
                            </div>

                            <div class="mb-3">
                                <label for="emailAddress" class="form-label">
                                    Email Address <span class="text-danger">*</span>
                                </label>
                                <input type="email" class="form-control" id="emailAddress" th:field="*{emailAddress}"
                                       placeholder="Enter email address" required>
                                <div class="form-text">The person's email address</div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                                       placeholder="Enter phone number">
                                <div class="form-text">The person's phone number (optional)</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="isActive" id="isActiveTrue" th:field="*{isActive}" th:value="true">
                                    <label class="form-check-label" for="isActiveTrue">
                                        Active
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="isActive" id="isActiveFalse" th:field="*{isActive}" th:value="false">
                                    <label class="form-check-label" for="isActiveFalse">
                                        Inactive
                                    </label>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/person}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Update Person
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{layout :: scripts}"></script>
</body>
</html>
